<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2022-06-27 (2022-06-27) fullscreen Hydra patch" />
  <title>2022-06-27 — 2022-06-27 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2022-06-27"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2022-06-27.js
  async function runPatch() {
    speed=1
    //s0.initScreen()
    a=()=>osc(50,0).thresh(0.5,0)
    b=()=>osc(75,0).thresh(0.5,0)
    c=()=>osc(100,0).thresh(0.5,0)
    
    v1=Math.random()
    v2=Math.random()
    v3=Math.random()
    v4=Math.random()*-0.00001/4.3
    v5=Math.random()*0.000012/4.3
    v6=Math.random()*-0.000013/4.3
    
    a().mask(
      shape(4,Math.random()*0.7)
      .scrollX( Math.random()*2-1)
        .scrollY( [v2,v3,v1].fast(0.213) )
          .modulateRotate(src(s0).scale(1.3),Math.PI)
    
    )
    .diff(
      b().mask(
      shape(4,Math.random()*0.7)
      .scrollX( Math.random()*2-1)
      .scrollY( [v1,v2,v3].fast(0.123) )
            .modulateRotate(src(s0).scale(1.3),Math.PI/2)
    )
    )
    .diff(
      c().mask(
      shape(4,Math.random()*0.7)
      .scrollX( Math.random()*2-1)
       .scrollY( [v3,v1,v2].fast(0.3) )
        .modulateRotate(src(s0).scale(1.3),Math.PI/3)
    )
    )
    .diff(
      src(o0).scrollY( Math.random()*0.00002, Math.random()*0.00000113)
      .scrollX( [v4,v5,v6],[v6,v4,v5]  )
      )
    .mask(src(o0).brightness([12,2,7,3,5].smooth(0.7)).contrast([14,5,7].smooth(1).fast(0.43)))
    .color(0,[v1,v3,v2].smooth(0.5),0)
    .scrollY(0.00001,0.00002)
    .scale(1.001)
    .mask( src(s0).scale(1.3).contrast(10) )
    .add( src(s0).scale(1.3) )
    .mult( src(s0).scale(1.3),0.5 )
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
