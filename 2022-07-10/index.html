<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2022-07-10 (2022-07-10) fullscreen Hydra patch" />
  <title>2022-07-10 — 2022-07-10 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2022-07-10"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2022-07-10.js
  async function runPatch() {
    shape(4,0.1,0).scrollY(0.1,0.1).scale( ()=>Math.sin(time/1)+1.5).scrollX(Math.random())
    .color( Math.random(), Math.random(), Math.random() )
    .diff( shape(4,0.1,0).scrollY(0.1,0.1).scale( ()=>Math.sin(time/2)+1.5).scrollX(Math.random()) )
    .diff( shape(4,0.1,0).scrollY(0.1,0.1).scale( ()=>Math.sin(time/3)+1.5).scrollX(Math.random()) )
    .diff( shape(4,0.1,0).scrollY(0.1,0.1).scale( ()=>Math.sin(time/4)+1.5).scrollX(Math.random()) )
    .repeat(3)
    
      .colorama( Math.random() * -100 )
    
    .diff( shape(4,0.1,0).scrollY(0.1,0.1).scale( ()=>Math.sin(time/5)+1.5).scrollX(Math.random()) )
    .diff( shape(4,0.1,0).scrollY(0.1,0.1).scale( ()=>Math.sin(time/6)+1.5).scrollX(Math.random()) )
    .diff( shape(4,0.1,0).scrollY(0.1,0.1).scale( ()=>Math.sin(time/7)+1.5).scrollX(Math.random()) )
    .repeat(4)
    
    .colorama( Math.random() * -100 )
    
    .diff( shape(4,0.1,0).scrollY(0.1,0.1).scale( ()=>Math.sin(time/8)+1.5).scrollX(Math.random()) )
    .diff( shape(4,0.1,0).scrollY(0.1,0.1).scale( ()=>Math.sin(time/9)+1.5).scrollX(Math.random()) )
    .diff( shape(4,0.1,0).scrollY(0.1,0.1).scale( ()=>Math.sin(time/10)+1.5).scrollX(Math.random()) )
    .repeat( Math.random()*10 )
    
    .modulateScale( shape([2,4] ) , Math.random()* 10)
    .modulateRotate( shape(2) , Math.PI/2)
    
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
