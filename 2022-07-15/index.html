<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — JM (2022-07-15) fullscreen Hydra patch" />
  <title>JM — 2022-07-15 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra JM"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2022-07-15.js
  async function runPatch() {
    solid(0.22,0.38,0.59)
    .layer(
    noise(0.5,0.05).thresh(0.5,0).color(1,0.84,0.2).mask(noise(0.5,0.05).thresh(0.5,0))
    )
    .layer(
    noise(0.4,0.04).thresh(0.5,0).color(0.43,0.58,0.24).mask(noise(0.4,0.04).thresh(0.5,0))
    )
    .layer(
    noise(0.4,0.04).thresh(0.5,0).color(0.43,0.58,0.24).mask(noise(0.4,0.04).thresh(0.5,0))
    )
    .layer(
    noise(0.35,0.035).thresh(0.5,0).color(0.19,0.34,0.51).mask(noise(0.35,0.035).thresh(0.5,0))
    )
    .layer(
    noise(0.44,0.0222).thresh(0.5,0).color(0.97,0.67,0.35).mask(noise(0.44,0.0222).thresh(0.5,0))
    )
    .layer(
    noise(0.44,0.032).thresh(0.5,0).color(0.87,0.91,0.94).mask(noise(0.44,0.032).thresh(0.5,0))
    )
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
