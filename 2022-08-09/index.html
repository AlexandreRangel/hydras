<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="hydras" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />

  <meta name="description" content="Livro HYDRA — 2022-08-09 (2022-08-09) fullscreen Hydra patch" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <title>2022-08-09 — 2022-08-09 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #hydra-canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      background: #000;
      z-index: 1;
    }
    #fs-hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 5;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      color: #eee;
      font: 500 13px/1.2 -apple-system, system-ui, sans-serif;
      letter-spacing: 0.02em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      text-align: center;
      max-width: min(92vw, 340px);
    }
    #fs-hint.show { opacity: 1; }
    #fs-hint.gone { display: none; }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2022-08-09"></canvas>
  <div id="fs-hint" aria-hidden="true">Toque para tela cheia</div>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  var hint = document.getElementById('fs-hint');
  var MAX_DPR = 2.5;
  var MAX_SIDE = 2048;

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
      || window.matchMedia('(display-mode: fullscreen)').matches
      || window.navigator.standalone === true;
  }

  function viewport() {
    var vv = window.visualViewport;
    var cssW = Math.max(1, Math.floor((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth));
    var cssH = Math.max(1, Math.floor((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight));
    var offsetX = (vv && typeof vv.offsetLeft === 'number') ? vv.offsetLeft : 0;
    var offsetY = (vv && typeof vv.offsetTop === 'number') ? vv.offsetTop : 0;
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    var w = Math.max(1, Math.floor(cssW * dpr));
    var h = Math.max(1, Math.floor(cssH * dpr));
    var longSide = Math.max(w, h);
    if (longSide > MAX_SIDE) {
      var scale = MAX_SIDE / longSide;
      w = Math.max(1, Math.floor(w * scale));
      h = Math.max(1, Math.floor(h * scale));
    }
    return { w: w, h: h, cssW: cssW, cssH: cssH, offsetX: offsetX, offsetY: offsetY, dpr: dpr };
  }

  function applyCanvasCss(n) {
    // Fill only the *visible* viewport (under Safari/Chrome UI chrome)
    canvas.style.width = n.cssW + 'px';
    canvas.style.height = n.cssH + 'px';
    canvas.style.left = n.offsetX + 'px';
    canvas.style.top = n.offsetY + 'px';
  }

  var s = viewport();
  applyCanvasCss(s);
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.w,
    height: s.h,
    preserveDrawingBuffer: false
  });

  function applyHydraSize(n) {
    applyCanvasCss(n);
    try {
      if (typeof setResolution === 'function') setResolution(n.w, n.h);
      else if (hydra && typeof hydra.setResolution === 'function') hydra.setResolution(n.w, n.h);
      else if (hydra && typeof hydra.resize === 'function') hydra.resize(n.w, n.h);
    } catch (e) { console.warn('resize', e); }
  }

  var resizeTimer = null;
  var lastKey = '';
  function onResize() {
    var attempts = 0;
    function tick() {
      attempts++;
      var n = viewport();
      var key = n.w + 'x' + n.h + '@' + n.cssW + 'x' + n.cssH + '+' + n.offsetX + ',' + n.offsetY;
      if (key !== lastKey) {
        lastKey = key;
        applyHydraSize(n);
      }
      if (attempts < 10) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(tick, attempts < 4 ? 40 : 100);
      }
    }
    tick();
  }

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 30); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
    window.visualViewport.addEventListener('scroll', onResize, { passive: true });
  }
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', function () { setTimeout(onResize, 30); });
  }
  setTimeout(onResize, 0);
  setTimeout(onResize, 200);

  // Cleaner fullscreen request
  function enterFullscreen() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (fn) {
      try {
        var ret = fn.call(el, { navigationUI: 'hide' });
        if (ret && ret.catch) ret.catch(function () {
          var fn2 = canvas.requestFullscreen || canvas.webkitRequestFullscreen;
          if (fn2) {
            var r = fn2.call(canvas);
            if (r && r.catch) r.catch(function () {});
          }
        });
      } catch (e) {
        try {
          var fn3 = canvas.requestFullscreen || canvas.webkitRequestFullscreen;
          if (fn3) fn3.call(canvas);
        } catch (e2) {}
      }
    }
  }

  function hideHint() {
    if (!hint) return;
    hint.classList.remove('show');
    setTimeout(function () { hint.classList.add('gone'); }, 400);
  }

  if (!isStandalone()) {
    setTimeout(function () { if (hint) hint.classList.add('show'); }, 600);
    setTimeout(hideHint, 4500);
  } else if (hint) {
    hint.classList.add('gone');
  }

  function onFirstPointer() {
    enterFullscreen();
    hideHint();
    onResize();
  }
  document.body.addEventListener('pointerdown', onFirstPointer, { once: true, passive: true });
  document.body.addEventListener('touchend', onFirstPointer, { once: true, passive: true });

  // Exact patch — patches/2022-08-09.js
  async function runPatch() {
    speed=0.7
    const date = new Date();
    let ms = ()=>date.getMilliseconds();
    let ms2 = ()=>date.getMilliseconds()*2;
    let ms3 = ()=>date.getMilliseconds()*3;
    let ms4 = ()=>date.getMilliseconds()+9999;
    let a = Math.random()*0.4+0.6
    let b = Math.random()*0.4+0.6
    let c = Math.random()*0.4-1.1
    let d = Math.random()*0.4-1.1
    
    solid(Math.random(),Math.random(),Math.random())
    .mult(noise(1.505,0.05))
    .diff(noise(2.71,0.022))
    .rotate(()=>Math.sin(time/600+ms())*Math.PI*2)
    .modulateScale(osc(()=>Math.sin(time/160+ms())+2,0.01).contrast(1.5).kaleid(50)
      ,2)
    .modulateRotate(osc(()=>Math.cos(time/298-ms())+2.5,-0.005).contrast(1.8).kaleid(50)
      ,Math.PI*-1).saturate(2)
    .add(osc(2,0.05,()=>Math.cos(time/170+ms3())*0.5+1.5).contrast(2),0.1)
      .mask(shape(100,0.7,0.13))
      .scale(1,innerHeight/innerWidth,1)
    .invert([0,-1,0,-1,a,-.75,0,c,.5,1,0.75,0,-0.5,-1].smooth(0.57).fast(0.154+(Math.random()*0.1)))
    .diff(shape(6,0.75,0.0).scrollX(0.075,-0.075))
    .modulateScrollX(voronoi(0.9,0.02),.2)
    .out(o0)
    
    solid(Math.random(),Math.random(),Math.random())
    .mult(noise(1.5,0.05))
    .diff(noise(2.6,0.023))
    .rotate(()=>Math.sin(time/600+ms2())*Math.PI*2)
    .modulateScale(osc(()=>Math.sin(time/155+ms2())+2,0.009).contrast(1.5).kaleid(50)
      ,2)
    .modulateRotate(osc(()=>Math.cos(time/333+ms3())+2.5,0.005).contrast(1.8).kaleid(50)
      ,Math.PI*-1).saturate(2)
    .add(osc(2,0.05,()=>Math.cos(time/222+ms())*0.5+1.5).contrast(2),0.1)
      .mask(shape(100,0.7,0.13))
      .scale(1,innerHeight/innerWidth,1)
    .diff(src(o2).scale(1.015).invert(),
           ()=>Math.sin(time*0.6+ms())*0.26+0.58)
    .invert([b,c,.75,a,1,0.75,0,-0.75,d,-1,-.75].smooth(0.57).fast(0.15+(Math.random()*0.1)))
    .diff(shape(6,0.75,0.0).scrollX(0.05,0.05))
    .modulateScrollX(voronoi(0.8,0.02),.2)
    .out(o1)
    
    solid(Math.random(),Math.random(),Math.random())
    .mult(noise(1.51,0.05))
    .diff(noise(2.42,0.021))
    .rotate(()=>Math.sin(time/600+ms2())*Math.PI*2)
    .modulateScale(osc(()=>Math.sin(time/157+ms3())+2,-0.008).contrast(1.5).kaleid(50)
      ,2)
    .modulateRotate(osc(()=>Math.cos(time/310-ms2())+2.5,0.005).contrast(1.8).kaleid(50)
      ,Math.PI*-1).saturate(2)
    .add(osc(2,0.05,()=>Math.cos(time/220-ms2())*0.5+1.5).contrast(2),0.1)
      .mask(shape(100,0.7,0.13))
      .scale(1,innerHeight/innerWidth,1)
    .invert([c,b,-0.75,-1,b,a,-.75,0,.5,1,0.75,c,0,a,1,-1,a].smooth(0.57).fast(0.14+(Math.random()*0.1)))
    .diff(shape(6,0.65,0.0).scrollX(0.05,0.05))
    .modulateScrollX(voronoi(0.7,0.02),.15)
    
    .out(o2)
    
    solid(Math.random(),Math.random(),Math.random())
    .mult(noise(1.53,0.05))
    .diff(noise(2.56,0.02))
    .rotate(()=>Math.sin(time/600+ms2())*Math.PI*2)
    .modulateScale(osc(()=>Math.sin(time/150+ms3())+2,0.01).contrast(1.5).kaleid(50)
      ,2)
    .modulateRotate(osc(()=>Math.cos(time/300-ms())+2.5,0.005).contrast(1.8).kaleid(50)
      ,Math.PI*-1).saturate(2)
    .add(osc(2,0.05,()=>Math.cos(time/200-ms())*0.5+1.5).contrast(2),0.1)
      .mask(shape(100,0.7,0.13))
      .scale(1,innerHeight/innerWidth,1)
    .diff(src(o0).scale(1.015)
          .invert([d,a,-1,-.75,0,.75,1,0.75,0,-0.75].smooth(0.57).fast(0.135+(Math.random()*0.1))),
           ()=>Math.sin(time*0.6+ms())*0.26+0.58)
    .diff(shape(6,0.5,0.0).scrollX(0.025,0.025))
    .modulateScrollX(voronoi(0.6,0.02),.2)
    
    .blend(src(o0).scale(1.015),
           ()=>Math.sin(time*0.6+ms())*0.26+0.58)
    
    .out(o3)
    
    
    render()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
