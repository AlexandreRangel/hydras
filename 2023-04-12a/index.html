<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2023-04-12a (2023-04-12a) fullscreen Hydra patch" />
  <title>2023-04-12a — 2023-04-12a · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #hydra-canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      background: #000;
      /* width/height set in JS to match viewport CSS px */
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2023-04-12a"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  // Higher internal res than CSS px, capped for mobile GPU smoothness (iOS + Android)
  var MAX_DPR = 2.5;
  var MAX_SIDE = 2048;

  function viewport() {
    var vv = window.visualViewport;
    var cssW = Math.max(1, Math.floor((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth));
    var cssH = Math.max(1, Math.floor((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight));
    // Prefer landscape/portrait from actual layout size (works on open + rotate)
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    var w = Math.max(1, Math.floor(cssW * dpr));
    var h = Math.max(1, Math.floor(cssH * dpr));
    var longSide = Math.max(w, h);
    if (longSide > MAX_SIDE) {
      var scale = MAX_SIDE / longSide;
      w = Math.max(1, Math.floor(w * scale));
      h = Math.max(1, Math.floor(h * scale));
    }
    return { w: w, h: h, cssW: cssW, cssH: cssH, dpr: dpr };
  }

  function applyCanvasCss(n) {
    canvas.style.width = n.cssW + 'px';
    canvas.style.height = n.cssH + 'px';
    canvas.style.left = '0px';
    canvas.style.top = '0px';
  }

  var s = viewport();
  applyCanvasCss(s);
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.w,
    height: s.h,
    preserveDrawingBuffer: false
  });

  function applyHydraSize(n) {
    applyCanvasCss(n);
    try {
      if (typeof setResolution === 'function') setResolution(n.w, n.h);
      else if (hydra && typeof hydra.setResolution === 'function') hydra.setResolution(n.w, n.h);
      else if (hydra && typeof hydra.resize === 'function') hydra.resize(n.w, n.h);
    } catch (e) { console.warn('resize', e); }
  }

  var resizeTimer = null;
  var lastKey = '';
  function onResize() {
    // iOS often reports stale sizes mid-rotation — sample a few times
    var attempts = 0;
    function tick() {
      attempts++;
      var n = viewport();
      var key = n.w + 'x' + n.h + '@' + n.cssW + 'x' + n.cssH;
      if (key !== lastKey) {
        lastKey = key;
        applyHydraSize(n);
      }
      if (attempts < 8) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(tick, attempts < 3 ? 50 : 120);
      }
    }
    tick();
  }

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 30); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
  }
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', function () { setTimeout(onResize, 30); });
  }
  // First paint after load (covers cold open already in landscape)
  setTimeout(onResize, 0);
  setTimeout(onResize, 200);

  // Exact patch — patches/2023-04-12a.js
  async function runPatch() {
    with_fx :echo do
      live_loop :drops1 do
        use_synth :pluck
        play scale(:c4,:aeolian).choose,
          amp: rrand(0.01,1.5),pan: [-1,1].choose
        wait [0.125,0.125,0.25,0.25,0.5,0.75,1,2].choose
        play scale(:c5,:aeolian).choose,
          amp: rrand(0.01,1), pan: [-1,1].choose
        wait [0.125,0.125,0.25,0.25,0.5,0.75,1,2].choose
      end
    end
    
    with_fx :echo do
      with_fx :flanger, mix: 0.8 do
        live_loop :drops2 do
          use_synth :pluck
          play scale([:e3,:c3].choose,:aeolian).choose,
            amp: rrand(0.01,1.333), pan: [-1,1].choose
          wait rrand(0.1,2)
          play scale(:c5,:aeolian).choose,
            amp: rrand(0.01,0.75), pan: [-1,1].choose
          wait rrand(0.1,2)
        end
      end
    end
    with_fx :compressor do
      with_fx :octaver, sub_amp: 1.5, super_amp: 0 do
        with_fx :echo, phase: 0.5, decay: 4 do
          live_loop :drops3 do
            with_fx :flanger, delay: 2, mix: 0.5 do
              use_synth :chiplead
              play scale(:e4,:aeolian).choose,
                attack: rrand(3,6), release: rrand(3,6),
                amp: rrand(0.01,1.8), pan: rrand(-1,1), pan_slide: 6
              wait rrand(3,5)
              play scale(:d3,:aeolian).choose,
                attack: 3, release: 2, amp: rrand(0.1,1.8),
                pan: rrand(-1,1), pan_slide: 6
              wait rrand(3,5)
            end
          end
        end
      end
    end
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
