<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2023-04-12a (2023-04-12a) fullscreen Hydra patch" />
  <title>2023-04-12a — 2023-04-12a · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2023-04-12a"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2023-04-12a.js
  async function runPatch() {
    with_fx :echo do
      live_loop :drops1 do
        use_synth :pluck
        play scale(:c4,:aeolian).choose,
          amp: rrand(0.01,1.5),pan: [-1,1].choose
        wait [0.125,0.125,0.25,0.25,0.5,0.75,1,2].choose
        play scale(:c5,:aeolian).choose,
          amp: rrand(0.01,1), pan: [-1,1].choose
        wait [0.125,0.125,0.25,0.25,0.5,0.75,1,2].choose
      end
    end
    
    with_fx :echo do
      with_fx :flanger, mix: 0.8 do
        live_loop :drops2 do
          use_synth :pluck
          play scale([:e3,:c3].choose,:aeolian).choose,
            amp: rrand(0.01,1.333), pan: [-1,1].choose
          wait rrand(0.1,2)
          play scale(:c5,:aeolian).choose,
            amp: rrand(0.01,0.75), pan: [-1,1].choose
          wait rrand(0.1,2)
        end
      end
    end
    with_fx :compressor do
      with_fx :octaver, sub_amp: 1.5, super_amp: 0 do
        with_fx :echo, phase: 0.5, decay: 4 do
          live_loop :drops3 do
            with_fx :flanger, delay: 2, mix: 0.5 do
              use_synth :chiplead
              play scale(:e4,:aeolian).choose,
                attack: rrand(3,6), release: rrand(3,6),
                amp: rrand(0.01,1.8), pan: rrand(-1,1), pan_slide: 6
              wait rrand(3,5)
              play scale(:d3,:aeolian).choose,
                attack: 3, release: 2, amp: rrand(0.1,1.8),
                pan: rrand(-1,1), pan_slide: 6
              wait rrand(3,5)
            end
          end
        end
      end
    end
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
