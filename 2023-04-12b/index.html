<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2023-04-12b (2023-04-12b) fullscreen Hydra patch" />
  <title>2023-04-12b — 2023-04-12b · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2023-04-12b"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2023-04-12b.js
  async function runPatch() {
    x1 = Math.random(); x2 = Math.random()
    x3 = Math.random(); x4 = Math.random()
    x5 = Math.random(); x6 = Math.random()
    y1 = Math.random(); y2 = Math.random()
    y3 = Math.random(); y4 = Math.random()
    y5 = Math.random(); y6 = Math.random()
    
    speed=0.6
    noise(1,0.010).contrast(5).pixelate(16+(x1*5),16+(x1*5))
    .scrollX(x1,0).scrollY(y1,0)
    .modulate(noise(1.5,0.011).contrast(5).pixelate(16+(x1*5),16+(x1*5))
             .scrollX(x2,0).scrollY(y2,0))
    .diff(
      noise(1.5,0.011).contrast(5).pixelate(20,20)
      .modulate(noise(2,0.012).contrast(5).pixelate(80,80)
               .scrollX(x3,0).scrollY(y3,0))
    )
    .diff(
      noise(2,0.012).contrast(5).pixelate(80,80)
      .scrollX(x4,0).scrollY(y4,0)
      .modulate(noise(2.5,0.013).contrast(5).pixelate(40,40)
                .scrollX(x5,0).scrollY(y5,0))
    )
    .mult(noise(2.5,0.013).contrast(5).pixelate(40,40)
           .scrollX(x6,0).scrollY(y6,0))
    //.color(0.7,0.5,0.5)
    .invert()
    .diff(src(o0))
    .scale(1.25)
    .scrollX(0.007,-0.007)
    .diff(src(o0).scale(1.1),x1)
    .scrollY( 0.01, ()=>Math.sin(time/999)*0.001 )
    //.mult( noise(4,0.011).contrast(1).pixelate(20,20),0.5 )
    .invert(x2)
      .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
