<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="hydras" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — Hydra 2023-12-03 (2023-08-15b) fullscreen Hydra patch" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <title>Hydra 2023-12-03 — 2023-08-15b · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    #hydra-canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      background: #000;
      z-index: 1;
    }
    #fs-hint {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      z-index: 5;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,0.55);
      color: #eee;
      font: 500 13px/1.2 -apple-system, system-ui, sans-serif;
      letter-spacing: 0.02em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      text-align: center;
      max-width: min(92vw, 340px);
    }
    #fs-hint.show { opacity: 1; }
    #fs-hint.gone { display: none; }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra Hydra 2023-12-03"></canvas>
  <div id="fs-hint" aria-hidden="true">Toque para tela cheia</div>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  var hint = document.getElementById('fs-hint');
  var MAX_DPR = 2.5;
  var MAX_SIDE = 2048;

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches
      || window.matchMedia('(display-mode: fullscreen)').matches
      || window.navigator.standalone === true;
  }

  function viewport() {
    var vv = window.visualViewport;
    var cssW = Math.max(1, Math.floor((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth));
    var cssH = Math.max(1, Math.floor((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight));
    var offsetX = (vv && typeof vv.offsetLeft === 'number') ? vv.offsetLeft : 0;
    var offsetY = (vv && typeof vv.offsetTop === 'number') ? vv.offsetTop : 0;
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    var w = Math.max(1, Math.floor(cssW * dpr));
    var h = Math.max(1, Math.floor(cssH * dpr));
    var longSide = Math.max(w, h);
    if (longSide > MAX_SIDE) {
      var scale = MAX_SIDE / longSide;
      w = Math.max(1, Math.floor(w * scale));
      h = Math.max(1, Math.floor(h * scale));
    }
    return { w: w, h: h, cssW: cssW, cssH: cssH, offsetX: offsetX, offsetY: offsetY, dpr: dpr };
  }

  function applyCanvasCss(n) {
    // Fill only the *visible* viewport (under Safari/Chrome UI chrome)
    canvas.style.width = n.cssW + 'px';
    canvas.style.height = n.cssH + 'px';
    canvas.style.left = n.offsetX + 'px';
    canvas.style.top = n.offsetY + 'px';
  }

  var s = viewport();
  applyCanvasCss(s);
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.w,
    height: s.h,
    preserveDrawingBuffer: false
  });

  function applyHydraSize(n) {
    applyCanvasCss(n);
    try {
      if (typeof setResolution === 'function') setResolution(n.w, n.h);
      else if (hydra && typeof hydra.setResolution === 'function') hydra.setResolution(n.w, n.h);
      else if (hydra && typeof hydra.resize === 'function') hydra.resize(n.w, n.h);
    } catch (e) { console.warn('resize', e); }
  }

  var resizeTimer = null;
  var lastKey = '';
  function onResize() {
    var attempts = 0;
    function tick() {
      attempts++;
      var n = viewport();
      var key = n.w + 'x' + n.h + '@' + n.cssW + 'x' + n.cssH + '+' + n.offsetX + ',' + n.offsetY;
      if (key !== lastKey) {
        lastKey = key;
        applyHydraSize(n);
      }
      if (attempts < 10) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(tick, attempts < 4 ? 40 : 100);
      }
    }
    tick();
  }

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 30); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
    window.visualViewport.addEventListener('scroll', onResize, { passive: true });
  }
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', function () { setTimeout(onResize, 30); });
  }
  setTimeout(onResize, 0);
  setTimeout(onResize, 200);

  // Cleaner fullscreen request
  function enterFullscreen() {
    var el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (fn) {
      try {
        var ret = fn.call(el, { navigationUI: 'hide' });
        if (ret && ret.catch) ret.catch(function () {
          var fn2 = canvas.requestFullscreen || canvas.webkitRequestFullscreen;
          if (fn2) {
            var r = fn2.call(canvas);
            if (r && r.catch) r.catch(function () {});
          }
        });
      } catch (e) {
        try {
          var fn3 = canvas.requestFullscreen || canvas.webkitRequestFullscreen;
          if (fn3) fn3.call(canvas);
        } catch (e2) {}
      }
    }
  }

  function hideHint() {
    if (!hint) return;
    hint.classList.remove('show');
    setTimeout(function () { hint.classList.add('gone'); }, 400);
  }

  if (!isStandalone()) {
    setTimeout(function () { if (hint) hint.classList.add('show'); }, 600);
    setTimeout(hideHint, 4500);
  } else if (hint) {
    hint.classList.add('gone');
  }

  function onFirstPointer() {
    enterFullscreen();
    hideHint();
    onResize();
  }
  document.body.addEventListener('pointerdown', onFirstPointer, { once: true, passive: true });
  document.body.addEventListener('touchend', onFirstPointer, { once: true, passive: true });

  // Exact patch — patches/2023-08-15b.js
  async function runPatch() {
    // as a mandala
    
    // licensed with CC BY-NC-SA 4.0 https://creativecommons.org/licenses/by-nc-sa/4.0/
    // "egg of the phoenix"
    // Alexandre Rangel
    // www.alexandrerangel.art.br/hydra.html
    
    speed=0.3
    
    
    shape(99,.15*1.79,.5).color(0,1,2)
    
    .diff( shape(240,.5*1.79,0).scrollX(.05).rotate( ()=>time/10 ).color(1,0,.75) )
    .diff( shape(99,.4*1.79,0).scrollX(.10).rotate( ()=>time/20 ).color(1,0,.75) )
    .diff( shape(99,.3*1.79,0).scrollX(.15).rotate( ()=>time/30 ).color(1,0,.75) )
    .diff( shape(99,.2*1.79,0).scrollX(.20).rotate( ()=>time/40 ).color(1,0,.75) )
    .diff( shape(99,.1*1.79,0).scrollX(.25).rotate( ()=>time/50 ).color(1,0,.75) )
    
    .modulateScale(
      shape(240,.5*1.79,0).scrollX(.05).rotate( ()=>time/10 )
      , ()=>(Math.sin(time/3)*.2)+.2 )
    //.scale(1.1)
    //.scale(1.6,.6,1)
    .scale(0.25)
    .colorama( ()=>(Math.sin(time*0.2)*.27)-0.15 )
    .kaleid(6)
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
