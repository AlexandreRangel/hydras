<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — Hydra 2023-12-03 (2023-08-15b) fullscreen Hydra patch" />
  <title>Hydra 2023-12-03 — 2023-08-15b · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra Hydra 2023-12-03"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2023-08-15b.js
  async function runPatch() {
    // as a mandala
    
    // licensed with CC BY-NC-SA 4.0 https://creativecommons.org/licenses/by-nc-sa/4.0/
    // "egg of the phoenix"
    // Alexandre Rangel
    // www.alexandrerangel.art.br/hydra.html
    
    speed=0.3
    
    
    shape(99,.15*1.79,.5).color(0,1,2)
    
    .diff( shape(240,.5*1.79,0).scrollX(.05).rotate( ()=>time/10 ).color(1,0,.75) )
    .diff( shape(99,.4*1.79,0).scrollX(.10).rotate( ()=>time/20 ).color(1,0,.75) )
    .diff( shape(99,.3*1.79,0).scrollX(.15).rotate( ()=>time/30 ).color(1,0,.75) )
    .diff( shape(99,.2*1.79,0).scrollX(.20).rotate( ()=>time/40 ).color(1,0,.75) )
    .diff( shape(99,.1*1.79,0).scrollX(.25).rotate( ()=>time/50 ).color(1,0,.75) )
    
    .modulateScale(
      shape(240,.5*1.79,0).scrollX(.05).rotate( ()=>time/10 )
      , ()=>(Math.sin(time/3)*.2)+.2 )
    //.scale(1.1)
    //.scale(1.6,.6,1)
    .scale(0.25)
    .colorama( ()=>(Math.sin(time*0.2)*.27)-0.15 )
    .kaleid(6)
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
