<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2024-01-23 (2024-01-23) fullscreen Hydra patch" />
  <title>2024-01-23 — 2024-01-23 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-01-23"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2024-01-23.js
  async function runPatch() {
    shape(4,0.9,()=>Math.cos(time/2)*0.2+0.25).rotate( ()=> time/40 )
    .colorama( ()=>Math.sin(time/5)*0.1 )
    .diff( shape(4,0.6,()=>Math.cos(time/3)*0.2+0.25)
          .rotate( ()=> time/-20 )
         .colorama( ()=>Math.cos(time/2.5)*0.1 ))
    .diff( shape(4,0.25,()=>Math.cos(time/4)*0.2+0.25)
          .rotate( ()=> time/-20 )
         .colorama( ()=>Math.sin(time/7.5)*0.1 ))
    .diff( shape(4,0.25,()=>Math.cos(time/5)*0.2+0.25)
          .rotate( ()=> time/-20 )
         .colorama( ()=>Math.sin(time/10)*0.1 ))
    .diff( shape(4,0.5,()=>Math.cos(time/6)*0.2+0.25)
          .scale( ()=>Math.cos(time/22.5)*0.5+0.6 )
          .rotate( ()=> time/20 )
         .colorama( ()=>Math.sin(time/15)*0.1 ))
    .diff( shape(90,()=>Math.sin(time/15)*0.5+0.525),
         ()=>Math.cos(time/7)*0.3+0.4)
    .diff( shape(90,()=>Math.sin(time/20)*0.5+0.525),
         ()=>Math.cos(time/8)*0.3+0.4)
    .diff( shape(90,()=>Math.sin(time/25)*0.5+0.525),
         ()=>Math.cos(time/9)*0.3+0.4)
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
