<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2024-04-11c (2024-04-11c) fullscreen Hydra patch" />
  <title>2024-04-11c — 2024-04-11c · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-04-11c"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2024-04-11c.js
  async function runPatch() {
    // made for https://hydra.ojack.xyz/dev
    
    await loadScript("https://hyper-hydra.glitch.me/hydra-outputs.js")
    await loadScript("https://cdn.statically.io/gl/metagrowing/extra-shaders-for-hydra/main/lib/lib-screen.js")
    await loadScript("https://cdn.statically.io/gl/metagrowing/extra-shaders-for-hydra/main/lib/lib-pattern.js")
    
    speed=0.72
    oS.setLinear()
    r1 = () => 0.1 * time / 2.2;
    r2 = () => 0.05 * time / 2.2;
    r3 = () => -0.03 * time / 2.2;
    r4 = () => -0.09 * time;
    
    n1 = () => Math.sin( time * 0.05) *0.3 + 1.2;
    
    spiral(2.0, 5.0, 0.2).rotate(r1).modulateRotate( noise(0.75,0.015).ditherrndcolor() )
      .mult( spiral(1.0, 3.0, 0.2).color(0,0.75,0.5).modulateRotate( noise(0.75,0.020).ditherrndcolor() ) )
      .diff( spiral(2.0, 5.0, 0.15).rotate(r2).color(0.333,0,0.1).modulateRotate( noise(0.75,0.025).ditherrndcolor() ) )
      .diff( spiral(2.0, 5.0, 0.15/2.0).ditherrndcolor().rotate(r3).color(0.15,0,0.333).modulateRotate( noise(0.75,0.030) ) )
    .rotate(r4)
    .dither2()
    .out(o0)
    
    src(o0)
    .add(
      src(o0).scale(0.996)
      .modulateRotate( noise( n1  ,0.007) )
      .modulateHue( noise( n1  ,0.007), 1 )
        ,0.5)
    .out(o1)
    
    render(o1)
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
