<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2024-04-14 (2024-04-14) fullscreen Hydra patch" />
  <title>2024-04-14 — 2024-04-14 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-04-14"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2024-04-14.js
  async function runPatch() {
    await loadScript("https://cdn.statically.io/gl/metagrowing/extra-shaders-for-hydra/main/lib/lib-noise.js")
    //s1.initScreen() // run just once
    
    speed=0.000001
    whitenoise( 800,1.01 ).color(0,0,1)
    .diff( whitenoise( 400,1.02 ).color(1,0,0).scrollX(0.1,-0.01) )
    .diff( whitenoise( 200,1.03 ).color(1,1,0).scrollX(0.05,-0.01) )
      .modulateScale( whitenoise( 25,1 ),0.5 )
    .diff( whitenoise( 100,1.04 ).scrollX(0.025,-0.005) )
    .diff( whitenoise( 50,1.05 ) )
      .modulateScale( noise(3,3000).contrast(20).pixelate(30,30),1.01 )
    
      .out(o1)
    
      src(o1)
        .color(1,0.333,1)
      .colorama(-0.01)
      .scale(1.2)
        .mult(src(o1).scale( ()=>Math.sin(time)*0.333+1.2 ) )
        .color(1,1,0.5)
      .colorama(0.01)
        .diff( src(s1) )
      .mult(src(o1).scale(2), 0.5 )
    .rotate( ()=>Math.PI*time*1000 )
    .modulateScale( osc(3.5,0,29999900), 1.34 )
            .add( src(s1) ,0.4)
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
