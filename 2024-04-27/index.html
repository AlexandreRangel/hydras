<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2024-04-27 (2024-04-27) fullscreen Hydra patch" />
  <title>2024-04-27 — 2024-04-27 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-04-27"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2024-04-27.js
  async function runPatch() {
    speed=0.7
    mySpeed=0.16
    osc(2040,-0.002*mySpeed,0)
    .mult( osc(40,-0.003*mySpeed,0).thresh(0.5,0) )
    .diff( osc(20,0.002*mySpeed,0).thresh(0.5,0).color(2,0,0) )
    .diff( osc(10,0.003*mySpeed,0).thresh(0.5,0).color(0,0,0.5) )
    .diff( osc(10,-0.01*mySpeed,2) )
    .modulateScale( osc(4.5,-0.04*mySpeed,2),0.81 )
    .diff( osc(10,0.01*mySpeed,2) )
    .color(1,0.81,1)
    .modulate(
      osc( ()=>Math.sin(time/9)*1.5+6.5 ,0,0).thresh(0.5,0)
      .diff( osc(6.27,0,0).rotate(Math.PI/2).thresh(0.5,0) )
      ,0.2
    )
    .rotate( ()=>time/-90 )
    .scrollY(0.01,-0.005)
    .scale(1.75)
    .rotate( ()=>time/77 )
    // .modulate(
    //   osc( ()=>Math.sin(time/18)*1.5+6.5 ,0,0).thresh(0.5,0)
    //   .diff( osc(6.27,0.001,0).rotate(Math.PI/2).thresh(0.5,0)H )
    //   ,0.1
    // )
    .diff( osc(4,-0.04, ()=>time/54.0 ) )
    .mult(
      shape(100,0.56,0.002).scale(1,1,16/9)
      .add( shape(100,0.15,0.002).scale(1,1,16/9).scrollX(0.395,0).scrollY(0.01, 0.01) )
      .add( shape(100,0.15,0.002).scale(1,1,16/9).scrollX(-0.395,0).scrollY(0.01, -0.01)  )
    )
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
