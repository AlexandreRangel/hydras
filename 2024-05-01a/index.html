<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2024-05-01a (2024-05-01a) fullscreen Hydra patch" />
  <title>2024-05-01a — 2024-05-01a · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-05-01a"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2024-05-01a.js
  async function runPatch() {
    speed = 0.45
    noise(0.25, 0.045)
    	.color(1, 0, 0)
    	.mult(shape(72, 0.45, 0.45, ))
    	.add(noise(0.50, 0.050)
    		.color(0, 0, 1)
    		.mult(shape(72, 0.45, 0.55)))
    	.add(noise(0.75, 0.045)
    		.color(1, 0, 0)
    		.mult(shape(72, 0.55, 0.45)))
    	.add(noise(1.00, 0.050)
    		.color(0, 0, 1)
    		.mult(shape(72, 0.55, 0.45)))
    	.add(noise(1.25, 0.055)
    		.color(0, 0, 1)
    		.mult(shape(72, 0.55, 0.45)))
    	.diff(noise(1.50, 0.020)
    		.invert()
    		//.color( ()=>Math.sin(time/22)*0.5+0.333 , ()=>Math.sin(time/31)*2-2, ()=>Math.sin(time/21)*0.5+0.333 )
    		.mult(shape(108, 0.55, 0.3)))
    	.color(() => Math.sin(time / 37) * 0.5 + 1.4, 0.5, () => Math.sin(time / 44) * 0.5 + 1.4)
    	.modulate(shape(100, 0.33, 0.41), 0.4)
    	.rotate(() => time / -27)
    	.scale(-1, -1, 0.99)
    	.out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
