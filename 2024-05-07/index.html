<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2024-05-07 (2024-05-07) fullscreen Hydra patch" />
  <title>2024-05-07 — 2024-05-07 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-05-07"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2024-05-07.js
  async function runPatch() {
    speed=0.16
    
    noise(6,.04)
    .mult( osc(9,0, ()=>Math.sin(time/1.5)+2 ) )
    .mult(
        noise(9,.025).brightness(1.2).contrast(2)
        .mult( osc(9,0, ()=>Math.sin(time/3)+13 ) )
      .kaleid(4).scale(0.75,1,16/9)
    )
    .diff(
        noise(15,.02).brightness(.2).contrast(1.3)
        .mult( osc(9,0, ()=>Math.sin(time/5)+2 ) )
        .rotate( ()=>time/45 )
      	.kaleid(8).scale(0.75,1,16/9)
    )
    .scale( ()=>Math.sin(time/27)*.50+.60 )
    .modulateScale(
        osc( ()=>Math.sin(time/36)*4+5 ,0.0052,0).mult( osc(3,0,0).rotate(3.14/2) )
        .rotate( ()=>time/25 ).scale(.39).scale(1,.6,1).invert()
        , ()=>Math.sin(time/27)*1.5+3  )
    	.kaleid(12).scale(0.72,1,16/9)
    
    .diff(
        noise(6,.027).brightness(.2).contrast(1.3)
        .mult( osc(9,0, ()=>Math.sin(time/5)+2 ) )
        .rotate( ()=>time/81 )
      	.kaleid(2).scale(0.52,1,16/9)
    )
    
    .mult( shape(100,.9,.005).scale(0.612,1,16/9) )
    
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
