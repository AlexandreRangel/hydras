<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>2024-05-13 — 2024-05-13 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-05-13"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2024-05-13.js
  async function runPatch() {
    await loadScript("https://hyper-hydra.glitch.me/hydra-outputs.js")
    oS.setLinear()
    //oS.setNearest()
    
    await loadScript("https://hyper-hydra.glitch.me/hydra-outputs.js")
    oS.setLinear()
    //oS.setNearest()
    
    speed=0.9
    voronoi(2.5,0.0333,0).thresh(0.5,0.1)
    //.color(1,0,0)
    //.diff( voronoi(3.5,0.0333,0).thresh(0.5,0.1)  )
    .mult( voronoi(3.4,0.03319,0).thresh(0.5,0.1)  )
    
    .color(0.7,0,0)
    
    .add( voronoi(3.33,0.0313,0).thresh(0.81,0.025).color(0,0,1) )
    .add( voronoi(4.5,0.0322,0).thresh(0.81,0.025).color(0,0,1) )
    //.add( voronoi(5.4,0.03339,0).thresh(0.81,0.025).color(0,0,1) )
    
    .modulateScrollX(
     osc(18.845,0).thresh(0.5,0)
    )
    
    .out(o0)
    .render(o0)
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
