  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #hydra-canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      background: #000;
      /* width/height set in JS to match viewport CSS px */
    }
  </style>

<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-06-05"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  // Higher internal res than CSS px, capped for mobile GPU smoothness (iOS + Android)
  var MAX_DPR = 2.5;
  var MAX_SIDE = 2048;

  function viewport() {
    var vv = window.visualViewport;
    var cssW = Math.max(1, Math.floor((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth));
    var cssH = Math.max(1, Math.floor((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight));
    // Prefer landscape/portrait from actual layout size (works on open + rotate)
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    var w = Math.max(1, Math.floor(cssW * dpr));
    var h = Math.max(1, Math.floor(cssH * dpr));
    var longSide = Math.max(w, h);
    if (longSide > MAX_SIDE) {
      var scale = MAX_SIDE / longSide;
      w = Math.max(1, Math.floor(w * scale));
      h = Math.max(1, Math.floor(h * scale));
    }
    return { w: w, h: h, cssW: cssW, cssH: cssH, dpr: dpr };
  }

  function applyCanvasCss(n) {
    canvas.style.width = n.cssW + 'px';
    canvas.style.height = n.cssH + 'px';
    canvas.style.left = '0px';
    canvas.style.top = '0px';
  }

  var s = viewport();
  applyCanvasCss(s);
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.w,
    height: s.h,
    preserveDrawingBuffer: false
  });

  function applyHydraSize(n) {
    applyCanvasCss(n);
    try {
      if (typeof setResolution === 'function') setResolution(n.w, n.h);
      else if (hydra && typeof hydra.setResolution === 'function') hydra.setResolution(n.w, n.h);
      else if (hydra && typeof hydra.resize === 'function') hydra.resize(n.w, n.h);
    } catch (e) { console.warn('resize', e); }
  }

  var resizeTimer = null;
  var lastKey = '';
  function onResize() {
    // iOS often reports stale sizes mid-rotation — sample a few times
    var attempts = 0;
    function tick() {
      attempts++;
      var n = viewport();
      var key = n.w + 'x' + n.h + '@' + n.cssW + 'x' + n.cssH;
      if (key !== lastKey) {
        lastKey = key;
        applyHydraSize(n);
      }
      if (attempts < 8) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(tick, attempts < 3 ? 50 : 120);
      }
    }
    tick();
  }

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 30); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
  }
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', function () { setTimeout(onResize, 30); });
  }
  // First paint after load (covers cold open already in landscape)
  setTimeout(onResize, 0);
  setTimeout(onResize, 200);

  // Exact patch — patches/2024-06-05.js
  async function runPatch() {
    solid(.1,.1,.1).mult( shape(100,0.3,0.001) )
    
    .add(
    osc(20,0.01,0).rotate(Math.PI/2).color(0.7,0.1,0.4).contrast(0.95).rotate( ()=> time*-0.0225 )
    .mult( shape(100,0.325,0.001)
    .mult( shape(1,0,0.001).rotate(-0.8) )
    .mult( shape(1,0,0.001).rotate(+0.8) )
    .rotate( ()=> time*0.0225 )
    ))
    
    .add(
    osc(20,0.01,0).rotate(Math.PI/2).color(0.3,0.1,0.8).contrast(0.95).rotate( ()=> time*0.025 )
    .mult( shape(100,0.325,0.001)
    .mult( shape(1,0,0.001).rotate(-0.8) )
    .mult( shape(1,0,0.001).rotate(-1.8) )
    .rotate( ()=> time*-0.025 )
    ))
    
    .add(
    osc(20,0.01,0).rotate(Math.PI/2).color(0.3,0.1,0.8).rotate( ()=> time*-0.0275 )
    .mult( shape(100,0.28,0.001)
    .mult( shape(1,0,0.001).rotate(-1.8) )
    .mult( shape(1,0,0.001).rotate(-2.8) )
    .rotate( ()=> time*0.0275 )
    ))
    
    .add(
    osc(20,0.01,0).rotate(Math.PI/2).color(0.3,0.8,0.2).rotate( ()=> time*0.03 )
    .mult( shape(100,0.3,0.001)
    .mult( shape(1,0,0.001).rotate(-2.8) )
    .mult( shape(1,0,0.001).rotate(-3.8) )
    .rotate( ()=> time*-0.03 )
    ))
    
    .mult( shape(100,0.175,0.001).invert(), 0.333 )
    .mult( osc(40,-0.01,1).kaleid(36).mult( shape(100,0.078,0.001).color(.6,.6,.6) ).invert() ) // iris
    .add( shape(100,0.111,0.001).mult( shape(100,0.078,0.001).invert() ), 0.7 ) // tarja branca
    .mult( shape(100,0.097,0.001).invert().add( shape(100,0.09,0.001) ), 0.75 ) // linha preta
    
    .scale(1,1,16/9)
    
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.20,0) ) //3
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.22,0) ) //3
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.24,0) ) //3
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.20,0).scrollY(0.035,0) ) //2
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.22,0).scrollY(0.035,0) ) //2
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.20,0).scrollY(0.070,0) ) //1
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.19,0).scrollY(0.105,0) ) //1
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.20,0).scrollY(-0.035,0) ) //2
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.22,0).scrollY(-0.035,0) ) //2
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.20,0).scrollY(-0.070,0) ) //1
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(0.19,0).scrollY(-0.105,0) ) //1
    
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.20,0) ) //3
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.22,0) ) //3
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.24,0) ) //3
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.20,0).scrollY(0.035,0) ) //2
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.22,0).scrollY(0.035,0) ) //2
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.20,0).scrollY(0.070,0) ) //1
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.19,0).scrollY(0.105,0) ) //1
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.20,0).scrollY(-0.035,0) ) //2
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.22,0).scrollY(-0.035,0) ) //2
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.20,0).scrollY(-0.070,0) ) //1
    .add( shape(32,0.0125,0.001).scale(1,1,16/9).scrollX(-0.19,0).scrollY(-0.105,0) ) //1
    
    .scale(1.5)
    
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
