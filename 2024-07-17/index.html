<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2024-07-17 (2024-07-17) fullscreen Hydra patch" />
  <title>2024-07-17 — 2024-07-17 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #hydra-canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      background: #000;
      /* width/height set in JS to match viewport CSS px */
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-07-17"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  // Higher internal res than CSS px, capped for mobile GPU smoothness (iOS + Android)
  var MAX_DPR = 2.5;
  var MAX_SIDE = 2048;

  function viewport() {
    var vv = window.visualViewport;
    var cssW = Math.max(1, Math.floor((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth));
    var cssH = Math.max(1, Math.floor((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight));
    // Prefer landscape/portrait from actual layout size (works on open + rotate)
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    var w = Math.max(1, Math.floor(cssW * dpr));
    var h = Math.max(1, Math.floor(cssH * dpr));
    var longSide = Math.max(w, h);
    if (longSide > MAX_SIDE) {
      var scale = MAX_SIDE / longSide;
      w = Math.max(1, Math.floor(w * scale));
      h = Math.max(1, Math.floor(h * scale));
    }
    return { w: w, h: h, cssW: cssW, cssH: cssH, dpr: dpr };
  }

  function applyCanvasCss(n) {
    canvas.style.width = n.cssW + 'px';
    canvas.style.height = n.cssH + 'px';
    canvas.style.left = '0px';
    canvas.style.top = '0px';
  }

  var s = viewport();
  applyCanvasCss(s);
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.w,
    height: s.h,
    preserveDrawingBuffer: false
  });

  function applyHydraSize(n) {
    applyCanvasCss(n);
    try {
      if (typeof setResolution === 'function') setResolution(n.w, n.h);
      else if (hydra && typeof hydra.setResolution === 'function') hydra.setResolution(n.w, n.h);
      else if (hydra && typeof hydra.resize === 'function') hydra.resize(n.w, n.h);
    } catch (e) { console.warn('resize', e); }
  }

  var resizeTimer = null;
  var lastKey = '';
  function onResize() {
    // iOS often reports stale sizes mid-rotation — sample a few times
    var attempts = 0;
    function tick() {
      attempts++;
      var n = viewport();
      var key = n.w + 'x' + n.h + '@' + n.cssW + 'x' + n.cssH;
      if (key !== lastKey) {
        lastKey = key;
        applyHydraSize(n);
      }
      if (attempts < 8) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(tick, attempts < 3 ? 50 : 120);
      }
    }
    tick();
  }

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 30); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
  }
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', function () { setTimeout(onResize, 30); });
  }
  // First paint after load (covers cold open already in landscape)
  setTimeout(onResize, 0);
  setTimeout(onResize, 200);

  // Exact patch — patches/2024-07-17.js
  async function runPatch() {
    set_sched_ahead_time! 9
    use_bpm 15
    with_fx :compressor, pre_amp: 11 do
      with_fx :echo, phase: 0.5, mix: 0.5 do
        with_fx :bitcrusher, mix: 0.2 do
          with_fx :echo, phase: 0.125 do
            with_fx :echo, phase: 0.25 do
              live_loop :click1 do
                with_fx :eq, high: rrand(-4,-2), high_slide: [0.125,0.25].choose do
                  with_fx :reverb, room: rrand(0.5,1), damp: rrand(0,0.5) do
                    with_fx :ping_pong, mix: rrand(0.4,0.8) do
                      with_fx :whammy, mix: rrand(0.222,0.333) do
                        with_fx :vowel, vowel_sound: [1,2,3,4,5].choose, mix: 0.8 do
                          use_synth :kalimba
                          play rrand(36,48), amp: rrand(0.7,1),
                            attack: rrand(0.001,0.1), release: rrand(0.001,0.1) if one_in([1,2,3,4].choose)
                          sleep [0.125,0.25].choose
                          sleep 1 if one_in(7)
                          play scale([:e2,:a2,:f1].choose,:spanish), amp: rrand(0.5,0.9),
                            attack: rrand(0.001,0.05), release: rrand(0.001,0.05) if one_in([1,2,3,4].choose)
                          sleep [0.125,0.25].choose
                          sleep 1 if one_in(9)
                        end
                      end
                    end
                  end
                end
              end
            end
          end
        end
      end
    end
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
