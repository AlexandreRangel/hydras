<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2024-07-17 (2024-07-17) fullscreen Hydra patch" />
  <title>2024-07-17 — 2024-07-17 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-07-17"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2024-07-17.js
  async function runPatch() {
    set_sched_ahead_time! 9
    use_bpm 15
    with_fx :compressor, pre_amp: 11 do
      with_fx :echo, phase: 0.5, mix: 0.5 do
        with_fx :bitcrusher, mix: 0.2 do
          with_fx :echo, phase: 0.125 do
            with_fx :echo, phase: 0.25 do
              live_loop :click1 do
                with_fx :eq, high: rrand(-4,-2), high_slide: [0.125,0.25].choose do
                  with_fx :reverb, room: rrand(0.5,1), damp: rrand(0,0.5) do
                    with_fx :ping_pong, mix: rrand(0.4,0.8) do
                      with_fx :whammy, mix: rrand(0.222,0.333) do
                        with_fx :vowel, vowel_sound: [1,2,3,4,5].choose, mix: 0.8 do
                          use_synth :kalimba
                          play rrand(36,48), amp: rrand(0.7,1),
                            attack: rrand(0.001,0.1), release: rrand(0.001,0.1) if one_in([1,2,3,4].choose)
                          sleep [0.125,0.25].choose
                          sleep 1 if one_in(7)
                          play scale([:e2,:a2,:f1].choose,:spanish), amp: rrand(0.5,0.9),
                            attack: rrand(0.001,0.05), release: rrand(0.001,0.05) if one_in([1,2,3,4].choose)
                          sleep [0.125,0.25].choose
                          sleep 1 if one_in(9)
                        end
                      end
                    end
                  end
                end
              end
            end
          end
        end
      end
    end
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
