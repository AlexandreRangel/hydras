<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2024-07-18b (2024-07-18b) fullscreen Hydra patch" />
  <title>2024-07-18b — 2024-07-18b · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-07-18b"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2024-07-18b.js
  async function runPatch() {
    speed=-0.16
    noise(8.81,0.02).contrast(3.5)
    .mult( osc(3,-0.2,1) )
    .diff( osc(3,-0.1,1).rotate(Math.PI/2) )
    .invert()
    .add( noise(3,0.09).rotate( ()=>time/22 ) , 1 )
    .scale(0.55)
    .modulate( osc( ()=>Math.sin(time/99)*0.5+3 ,0.015,1),1.25  )
    .out(o0)
    
    src(o0)
    .blend( src(o0).scale(1.005).scrollX(0.001).color(1,0,1),0.222 )
    .blend( src(o0).scale(1.005).scrollX(0.002).color(1.3,0.3,1.3).modulate(src(o0),0.14),0.2 )
    .kaleid(8)
    .out(o1)
    
    render(o1)
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
