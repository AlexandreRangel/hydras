<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — Cerrado Jazz (2024-07-23) fullscreen Hydra patch" />
  <title>Cerrado Jazz — 2024-07-23 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra Cerrado Jazz"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2024-07-23.js
  async function runPatch() {
    await loadScript("https://hyper-hydra.glitch.me/hydra-blend.js")
    await loadScript("https://hyper-hydra.glitch.me/hydra-wrap.js")
    hydraWrap.setNoWrap()
    s0.initImage("https://alexandrerangel.art.br/temp/linha-1.png")
    
    
    src(s0).scale(0.8,1,0.24).scrollX( ()=>Math.cos(time/7)*0.45 ,0).kaleid(2)
    .add( src(s0).scale(0.8,1,0.24).scrollX( ()=>Math.cos(time/7)*0.45 ,0) )
    .add( src(s0).scale(0.8,1,-0.24).scrollX( ()=>Math.cos(time/7)*-0.45 ,0).scrollY(-0.2) )
    .add( src(s0).scale(0.8,1,-0.24).scrollX( ()=>Math.cos(time/7)*-0.45 ,0).scrollY(+0.2) )
    .add( src(s0).scale(0.8,1,0.24).scrollX( ()=>Math.cos(time/7)*0.75 ,0).scrollY(-0.4) )
    .add( src(s0).scale(0.8,1,0.24).scrollX( ()=>Math.cos(time/7)*0.75 ,0).scrollY(+0.4) )
    
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
