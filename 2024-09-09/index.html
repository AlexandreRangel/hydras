<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — GPT mandalas 2 (2024-09-09) fullscreen Hydra patch" />
  <title>GPT mandalas 2 — 2024-09-09 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #hydra-canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      background: #000;
      /* width/height set in JS to match viewport CSS px */
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra GPT mandalas 2"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  // Higher internal res than CSS px, capped for mobile GPU smoothness (iOS + Android)
  var MAX_DPR = 2.5;
  var MAX_SIDE = 2048;

  function viewport() {
    var vv = window.visualViewport;
    var cssW = Math.max(1, Math.floor((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth));
    var cssH = Math.max(1, Math.floor((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight));
    // Prefer landscape/portrait from actual layout size (works on open + rotate)
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    var w = Math.max(1, Math.floor(cssW * dpr));
    var h = Math.max(1, Math.floor(cssH * dpr));
    var longSide = Math.max(w, h);
    if (longSide > MAX_SIDE) {
      var scale = MAX_SIDE / longSide;
      w = Math.max(1, Math.floor(w * scale));
      h = Math.max(1, Math.floor(h * scale));
    }
    return { w: w, h: h, cssW: cssW, cssH: cssH, dpr: dpr };
  }

  function applyCanvasCss(n) {
    canvas.style.width = n.cssW + 'px';
    canvas.style.height = n.cssH + 'px';
    canvas.style.left = '0px';
    canvas.style.top = '0px';
  }

  var s = viewport();
  applyCanvasCss(s);
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.w,
    height: s.h,
    preserveDrawingBuffer: false
  });

  function applyHydraSize(n) {
    applyCanvasCss(n);
    try {
      if (typeof setResolution === 'function') setResolution(n.w, n.h);
      else if (hydra && typeof hydra.setResolution === 'function') hydra.setResolution(n.w, n.h);
      else if (hydra && typeof hydra.resize === 'function') hydra.resize(n.w, n.h);
    } catch (e) { console.warn('resize', e); }
  }

  var resizeTimer = null;
  var lastKey = '';
  function onResize() {
    // iOS often reports stale sizes mid-rotation — sample a few times
    var attempts = 0;
    function tick() {
      attempts++;
      var n = viewport();
      var key = n.w + 'x' + n.h + '@' + n.cssW + 'x' + n.cssH;
      if (key !== lastKey) {
        lastKey = key;
        applyHydraSize(n);
      }
      if (attempts < 8) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(tick, attempts < 3 ? 50 : 120);
      }
    }
    tick();
  }

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 30); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
  }
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', function () { setTimeout(onResize, 30); });
  }
  // First paint after load (covers cold open already in landscape)
  setTimeout(onResize, 0);
  setTimeout(onResize, 200);

  // Exact patch — patches/2024-09-09.js
  async function runPatch() {
    # Set the tempo and tuning to 432Hz
    use_bpm 30
    use_tuning :just
    set(:scale, :minor_pentatonic)
    
    
    with_fx :compressor, mix: 0.75 do
    
      # Function to create a lush, evolving pad sound
      define :ambient_pad do |note, amp=0.3, pan=0|
        with_fx :reverb, room: 1, damp: 0.8 do
          with_fx :slicer, phase: [8, 16].choose, mix: 0.2 do
            synth :sine, note: note, sustain: 10, release: 6, attack: 4, amp: amp, pan: pan
            synth :tri, note: note - 12, sustain: 10, release: 6, attack: 4, amp: amp * 0.7, pan: -pan
          end
        end
      end
    
      # Function to generate slowly evolving melodies
      define :melody do |scale|
        use_random_seed Time.now.usec
        8.times do
          play (scale.choose), release: 6, amp: 0.2
          sleep [4, 8].choose
        end
      end
    
      # Background texture using noise
      live_loop :background_noise do
        with_fx :reverb, room: 1, damp: 0.6, mix: 0.7 do
          with_fx :ixi_techno, phase: 16, mix: 0.3 do
            synth :dark_ambience, note: :e2, sustain: 24, amp: 0.1, release: 8
          end
        end
        sleep [8,16,24,32].choose
      end
    
      # Evolving pad layers
      live_loop :pads do
        notes = scale(:e3, get(:scale), num_octaves: 2).shuffle.take(3)
        ambient_pad(notes[0], 0.4, -0.3)
        sleep 4
        ambient_pad(notes[1], 0.3, 0.3)
        sleep 4
        ambient_pad(notes[2], 0.5, -0.2)
        sleep [8,16,24,32].choose
      end
    
      # Evolving melody layers
      live_loop :melodies do
        use_synth :piano
        melody(scale(:e4, get(:scale), num_octaves: 2))
        sleep [2,4,8,16,24].choose
      end
    
      # Soft, warm bassline
      live_loop :bassline do
        with_fx :reverb, room: 1, damp: 0.3, mix: 0.5 do
          use_synth :tri
          play scale(:e2, :minor_pentatonic).choose, release: 16, amp: 0.3
        end
        sleep [8,16,24,32].choose
      end
    
      # Sporadic bell sounds for a transcendental feel
      live_loop :bells do
        sync :melodies
        with_fx :gverb, room: 60, mix: 0.3 do
          use_synth :pretty_bell
          play scale(:e5, :minor_pentatonic).choose, release: 8, amp: 0.1
          sleep [8,16,24,32].choose
        end
      end
    
    end
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
