    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {

      inset: 0;

      overflow: hidden;
      background: #000;

      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #hydra-canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      background: #000;
      /* width/height set in JS to match viewport CSS px */
    }

<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2024-12-14"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  // Higher internal res than CSS px, capped for mobile GPU smoothness (iOS + Android)
  var MAX_DPR = 2.5;
  var MAX_SIDE = 2048;

  function viewport() {
    var vv = window.visualViewport;
    var cssW = Math.max(1, Math.floor((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth));
    var cssH = Math.max(1, Math.floor((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight));
    // Prefer landscape/portrait from actual layout size (works on open + rotate)
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    var w = Math.max(1, Math.floor(cssW * dpr));
    var h = Math.max(1, Math.floor(cssH * dpr));
    var longSide = Math.max(w, h);
    if (longSide > MAX_SIDE) {
      var scale = MAX_SIDE / longSide;
      w = Math.max(1, Math.floor(w * scale));
      h = Math.max(1, Math.floor(h * scale));
    }
    return { w: w, h: h, cssW: cssW, cssH: cssH, dpr: dpr };
  }

  function applyCanvasCss(n) {
    canvas.style.width = n.cssW + 'px';
    canvas.style.height = n.cssH + 'px';
    canvas.style.left = '0px';
    canvas.style.top = '0px';
  }

  var s = viewport();
  applyCanvasCss(s);
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.w,
    height: s.h,
    preserveDrawingBuffer: false
  });

  function applyHydraSize(n) {
    applyCanvasCss(n);
    try {
      if (typeof setResolution === 'function') setResolution(n.w, n.h);
      else if (hydra && typeof hydra.setResolution === 'function') hydra.setResolution(n.w, n.h);
      else if (hydra && typeof hydra.resize === 'function') hydra.resize(n.w, n.h);
    } catch (e) { console.warn('resize', e); }
  }

  var resizeTimer = null;
  var lastKey = '';
  function onResize() {
    // iOS often reports stale sizes mid-rotation — sample a few times
    var attempts = 0;
    function tick() {
      attempts++;
      var n = viewport();
      var key = n.w + 'x' + n.h + '@' + n.cssW + 'x' + n.cssH;
      if (key !== lastKey) {
        lastKey = key;
        applyHydraSize(n);
      }
      if (attempts < 8) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(tick, attempts < 3 ? 50 : 120);
      }
    }
    tick();
  }

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 30); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
  }
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', function () { setTimeout(onResize, 30); });
  }
  // First paint after load (covers cold open already in landscape)
  setTimeout(onResize, 0);
  setTimeout(onResize, 200);

  // Exact patch — patches/2024-12-14.js

    .modulate( shape(2, ()=>Math.cos(time/10)*0.5+0.5 ,0.000), ()=>Math.sin(time/2)*0.5+0.5 )
    
    .sub( text( '1100000000' ).scale(0.05).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color([1,0,1,0].fast(2),0,0) )
    .add( text( '0000000011' ).scale(0.05).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color(0,[1,0,1,0].fast(2.1),0) )
    .sub( text( '1111111111' ).scale(0.06).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color([1,0,1,0].fast(2),0,0) )
    .sub( text( '1010101010' ).scale(0.06).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color(0,[1,0,1,0].fast(2.1),0) )
    .add( text( '1101010100' ).scale(0.1).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color([1,0,1,0].fast(2.2),0,0) )
    .sub( text( '0000000000' ).scale(0.1).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color(0,[1,0,1,0].fast(2.3),0) )
    .sub( text( '1100000000' ).scale(0.05).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color([1,0,1,0].fast(1),0,0) )
    .add( text( '1111111111' ).scale(0.05).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color(0,[1,0,1,0].fast(1.1),0) )
    .sub( text( '0000000000' ).scale(0.075).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color([1,0,1,0].fast(1),0,0) )

    .out(o1)

    .add( text( '0000000011' ).scale(0.05).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color(0,[1,0,1,0].fast(2.1),0) )

    .sub( text( '1010101010' ).scale(0.06).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color(0,[1,0,1,0].fast(2.1),0) )
    .add( text( '1101010100' ).scale(0.1).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color([1,0,1,0].fast(2.2),0,0) )
    .sub( text( '0010101011' ).scale(0.1).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color(0,[1,0,1,0].fast(2.3),0) )
    .sub( text( '1100000000' ).scale(0.05).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color([1,0,1,0].fast(1),0,0) )
    .add( text( '0000000011' ).scale(0.05).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color(0,[1,0,1,0].fast(1.1),0) )
    .sub( text( '0101010101' ).scale(0.075).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color([1,0,1,0].fast(1),0,0) )
    .sub( text( '1010101010' ).scale(0.075).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color(0,[1,0,1,0].fast(1.1),0) )
    .add( text( '1101010100' ).scale(0.1).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color([1,0,1,0].fast(1.3),0,0) )
    .sub( text( '0010101011' ).scale(0.1).scrollX(()=>Math.random()).scrollY(()=>Math.random()).color(0,[1,0,1,0].fast(1.3),0) )
    
    
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
