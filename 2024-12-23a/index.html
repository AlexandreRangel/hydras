<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — mandala (2024-12-23a) fullscreen Hydra patch" />
  <title>mandala — 2024-12-23a · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior: none;
    }
    #hydra-canvas {
      position: fixed;
      left: 0;
      top: 0;
      display: block;
      background: #000;
      /* width/height set in JS to match viewport CSS px */
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra mandala"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  // Higher internal res than CSS px, capped for mobile GPU smoothness (iOS + Android)
  var MAX_DPR = 2.5;
  var MAX_SIDE = 2048;

  function viewport() {
    var vv = window.visualViewport;
    var cssW = Math.max(1, Math.floor((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth));
    var cssH = Math.max(1, Math.floor((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight));
    // Prefer landscape/portrait from actual layout size (works on open + rotate)
    var dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    var w = Math.max(1, Math.floor(cssW * dpr));
    var h = Math.max(1, Math.floor(cssH * dpr));
    var longSide = Math.max(w, h);
    if (longSide > MAX_SIDE) {
      var scale = MAX_SIDE / longSide;
      w = Math.max(1, Math.floor(w * scale));
      h = Math.max(1, Math.floor(h * scale));
    }
    return { w: w, h: h, cssW: cssW, cssH: cssH, dpr: dpr };
  }

  function applyCanvasCss(n) {
    canvas.style.width = n.cssW + 'px';
    canvas.style.height = n.cssH + 'px';
    canvas.style.left = '0px';
    canvas.style.top = '0px';
  }

  var s = viewport();
  applyCanvasCss(s);
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.w,
    height: s.h,
    preserveDrawingBuffer: false
  });

  function applyHydraSize(n) {
    applyCanvasCss(n);
    try {
      if (typeof setResolution === 'function') setResolution(n.w, n.h);
      else if (hydra && typeof hydra.setResolution === 'function') hydra.setResolution(n.w, n.h);
      else if (hydra && typeof hydra.resize === 'function') hydra.resize(n.w, n.h);
    } catch (e) { console.warn('resize', e); }
  }

  var resizeTimer = null;
  var lastKey = '';
  function onResize() {
    // iOS often reports stale sizes mid-rotation — sample a few times
    var attempts = 0;
    function tick() {
      attempts++;
      var n = viewport();
      var key = n.w + 'x' + n.h + '@' + n.cssW + 'x' + n.cssH;
      if (key !== lastKey) {
        lastKey = key;
        applyHydraSize(n);
      }
      if (attempts < 8) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(tick, attempts < 3 ? 50 : 120);
      }
    }
    tick();
  }

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 30); });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', onResize, { passive: true });
  }
  if (window.screen && screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', function () { setTimeout(onResize, 30); });
  }
  // First paint after load (covers cold open already in landscape)
  setTimeout(onResize, 0);
  setTimeout(onResize, 200);

  // Exact patch — patches/2024-12-23a.js
  async function runPatch() {
    speed=0.1
    // Core layer: "Straight-edged circles" simulated with square-based rotations
    shape(4, 0.6, 0.9)
      .scale(() => Math.abs(Math.sin(time * 0.3)) * 0.5 + 0.4) // Dynamic size change
      .repeat(4, 4) // Create a grid-like structure
      .modulate(osc(10, 0.2, 0.8).rotate(Math.PI / 4)) // Use square-based distortion
      .rotate(({time}) => Math.sin(time * 0.1) * Math.PI / 4) // Rotation skewing the idea of curves
      .color(1.0, 0.3, 0.6)
      .luma(0.2)
      .out(o0);
    
    // Background layer: Square "curves" with sharp oscillating brightness
    osc(15, 0.05, 0.8)
      .kaleid(4) // Reinforce symmetry of "4"
      .modulateRotate(shape(4, 0.4).scale(2).luma(0.5).invert(), 0.3)
      .colorama(0.8)
      .scale(() => Math.abs(Math.cos(time * 0.4)) * 0.3 + 1.2) // Dynamic breathing
      .blend(noise(3, 0.5).modulate(osc(10), 0.3), 0.5)
      .out(o1);
    
    // Secondary modulation layer: Overlays to distort "geometry"
    osc(8, 0.03, 0.9)
      .rotate(() => Math.abs(Math.sin(time * 0.5)) * Math.PI / 4) // Exaggerating square-based rotation
      .mult(shape(4, 0.7).rotate(Math.PI / 4))
      .modulate(noise(6, 0.3), 0.6)
      .add(shape(4, 0.4).scale(2).invert(), 0.4)
      .color(0.6, 0.9, 1.0)
      .scrollY(0.3, 0.1)
      .out(o2);
    
    // Combine all layers with square-distorted interactions
    src(o0)
      .layer(src(o1).blend(src(o2).scale(0.8).rotate(Math.PI / 4), 0.6))
      .modulate(osc(6, 0.05, 0.8).kaleid(4), 0.3)
      .add(shape(4, 0.8).scale(1.5).luma(0.5).invert(), 0.2)
      .blend(osc(5, 0.2, 0.6).kaleid(4).modulateRotate(noise(2), 0.4), 0.5)
    .rotate(0.1,0.003)
    .kaleid(4)
    .contrast(1.25)
      .out(o3);
    
    // Render final composite
    render(o3);
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
