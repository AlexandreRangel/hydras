<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2025-01-14 (2025-01-14) fullscreen Hydra patch" />
  <title>2025-01-14 — 2025-01-14 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2025-01-14"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2025-01-14.js
  async function runPatch() {
    await loadScript("https://hyper-hydra.glitch.me/hydra-blend.js")
    
    await loadScript("https://cdn.statically.io/gl/metagrowing/extra-shaders-for-hydra/main/lib/lib-screen.js")
    
    speed=0.05
    shape(4,0.3,0.02).scrollX(0.025,-0.04).scrollY(0.0250,-0.0401).color(0,0,1)
    .diff( shape(4,0.25,0).scrollX(0.025,-0.045).scrollY(0.025,-0.0451) )
    .diff( shape(4,0.2,0).scrollX(0.025,-0.055).scrollY(0.025,-0.0551) )
    
    .diff( shape(4,0.15,0).scrollX(0.025,0.035).scrollY(0.025,0.0352) )
    .diff( shape(4,0.10,0).scrollX(0.025,0.031).scrollY(0.025,0.032) )
    .diff( shape(4,0.05,0.02).scrollX(0.025,0.021).scrollY(0.025,0.022).color(1,0,0) )
    .out(o1)
    
    
    src(o1).kaleid(2)
    .diff( src(o1).kaleid(4) )
    .diff( src(o1).repeat(2).invert().kaleid(4)
         .repeat( ()=>Math.sin(time/19)*3.5+5 )
         .color( ()=>Math.cos(time/10)*1,
                 ()=>Math.sin(time/11.1)*0.8-0.4,
                 ()=>Math.cos(time/12.2)*1
               )
        .modulateScale(src(o1).kaleid(4)) )
    .rotate(Math.PI/2).repeat([2,4,4,8,8,10,4,2].fast(0.7),[2,2,4,8].fast(0.35))
    .scrollY(0.1,0.02)
    .pixelate(160,160)
    
    .modulateScale( shape(4,0.45,0), 10.99 )
    .modulateRotate( shape(4,0.45,0), Math.PI/-1  )
    
    .out(o2)
    
    src(o2).edge().out(o3)
    
    src(o2)
    
    .negate(src(o3).dilate().dither2(), 1)
    
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
