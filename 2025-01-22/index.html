<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2025-01-22 (2025-01-22) fullscreen Hydra patch" />
  <title>2025-01-22 — 2025-01-22 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2025-01-22"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2025-01-22.js
  async function runPatch() {
    await loadScript("https://cdn.statically.io/gl/metagrowing/extra-shaders-for-hydra/main/lib/lib-screen.js")
    
    speed=0.5
    
    shape(4,1,0.001).scale(1,0.01,0.5).scrollX( ()=>Math.sin(time/5)*0.2,0.01).scrollX(-0.025,0)
    .add( shape(4,1,0.001).scale(1,0.01,0.5).scrollX( ()=>Math.sin(time/5)*0.2,0.01) )
    .add( shape(4,1,0.001).scale(1,0.01,0.5).scrollX( ()=>Math.sin(time/5)*0.2,0.01).scrollX(+0.025,0) )
    
    .add(shape(4,1,0.001).scale(1,0.02,0.7).scrollX( ()=>Math.sin(time/6)*0.2,0.01).scrollX(-0.05,0) )
    .add( shape(4,1,0.001).scale(1,0.02,0.7).scrollX( ()=>Math.sin(time/6)*0.2,0.01) )
    .add( shape(4,1,0.001).scale(1,0.02,0.7).scrollX( ()=>Math.sin(time/6)*0.2,0.01).scrollX(+0.05,0) )
    
    
    .diff( shape(4,1,0.001).scale(1,0.03,0.8).scrollX( ()=>Math.sin(time/7)*0.2,0.01).scrollX(-0.075,0) )
    .diff( shape(4,1,0.001).scale(1,0.03,0.8).scrollX( ()=>Math.sin(time/7)*0.2,0.01) )
    .diff( shape(4,1,0.001).scale(1,0.03,0.8).scrollX( ()=>Math.sin(time/7)*0.2,0.01).scrollX(+0.075,0) )
    .out(o0)
    
    src(o0)
    .modulate( src(o0).scale(1.01).dither4() )
    .add( src(o0).scale(3,1,0.2) , 0.05 )
    .add( src(o0).scale(3,1,0.19) , 0.075 )
    .out(o3)
    
    src(o0)
    .modulate( src(o0).scale(1.01).dither4().dither() )
    .diff( src(o0).scale(3,1,0.2) , 0.05 )
    .diff( src(o0).scale(3,1,0.19) , 0.075 )
    //.scale(1,-1,1)
    .out(o2)
    
    src(o0)
    .modulate( src(o0).scale(1.01).dither4() )
    .out(o1)
    
    render()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
