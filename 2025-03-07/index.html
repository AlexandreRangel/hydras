<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2025-03-07 (2025-03-07) fullscreen Hydra patch" />
  <title>2025-03-07 — 2025-03-07 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2025-03-07"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2025-03-07.js
  async function runPatch() {
    noise(0.5,0.11/3).modulate( src(o3).thresh(0.5,0) )
      .colorama(-0.1).kaleid([2,4,6,8].fast(0.333))
      .out(o0)
    noise(0.6,0.12/3).modulate( src(o2).thresh(0.5,0) )
      .colorama(-0.2).kaleid([4,6,8,2].fast(0.333))
      .out(o1)
    noise(0.7,0.13/3).modulate( src(o1).thresh(0.5,0) )
    .colorama(-0.3).kaleid([6,8,2,4].fast(0.333))
      .out(o2)
    noise(0.8,0.14/3).modulate( src(o0).thresh(0.5,0) )
    .colorama(-0.4).kaleid([8,2,4,6].fast(0.333))
      .out(o3)
    
    render()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
