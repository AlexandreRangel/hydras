<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — 2025-03-31 (2025-03-31) fullscreen Hydra patch" />
  <title>2025-03-31 — 2025-03-31 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra 2025-03-31"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2025-03-31.js
  async function runPatch() {
    speed=0.3
    shape(4,0.05,0.002).scale(1,1,16/9)
    .scrollX( ()=>Math.sin(time/15)*0.25 ).scrollY( ()=>Math.sin(time/15)*0.45 ).scrollX( ()=>Math.cos(time/15)*0.25/2 )
    
    .diff(
    	shape(4,0.1,0.002).scale(1,1,16/9)
    	.scrollX( ()=>Math.cos(time/17)*0.25 ).scrollY( ()=>Math.cos(time/17)*0.45 ).scrollX( ()=>Math.sin(time/17)*0.25/2 )
    ).out(o1)
    
    src(o1)
    .diff( src(o1).scale(1.1/3.5) )
    .diff( src(o1).scale(1.6/3.5) )
    .diff( src(o1).scale(1.8/3.5) )
    .diff( src(o1).scale(2.5/3.5) )
    .diff( src(o1).scale(3.6/3.5) )
    .add( src(o1).scale(0.9/3.5), 0.25 )
    .out(o2)
    
    src(o2)
    .diff( src(o2).scale( ()=>Math.sin(time/3)*0.1+1 ) )
    .add( src(o1).scale( ()=>Math.cos(time/10)*0.1+1 ).color(1,0,0).rotate(0.004,0.004) )
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
