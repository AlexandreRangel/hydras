<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — Hydra Daydream (2025-11-10) fullscreen Hydra patch" />
  <title>Hydra Daydream — 2025-11-10 · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra Hydra Daydream"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2025-11-10.js
  async function runPatch() {
    // licensed with CC BY-NC-SA 4.0 https://creativecommons.org/licenses/by-nc-sa/4.0/
    // "the-wall"
    // Alexandre Rangel
    // www.alexandrerangel.art.br/hydra.html
    
    speed=0.02
    osc(48,-.1,0).thresh([.3,.7].fast(.75),0).color(0,0,1)
    
    .add(
        osc(28,.1,0).thresh([.3,.7].fast(.75),0).rotate(3.14/4)
        .color(1,0,0)
        .modulateScale( osc(64,-.01,0).thresh([.3,.7].fast(.75),0) )
    )
    .diff(
        osc(28,.1,0).thresh([.3,.7].fast(.5),0).rotate(3.14/2)
        .color(1,0,1)
        .modulateScale( osc(64,-.015,0).thresh([.3,.7].fast(.5),0) )
    )
    .modulateRotate( osc(54,-.005,0).thresh([.3,.7].fast(.25),0) )
    .modulateScale( osc(44,-.020,0).thresh([.3,.7].fast(.25),0) )
    .colorama( ()=>Math.sin(time/33)*.01222+9.89)
    .scale(2.122*2)
    
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
