<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="author" content="Alexandre Rangel" />
  <meta name="description" content="Livro HYDRA — Coração (2026-07-14b) fullscreen Hydra patch" />
  <title>Coração — 2026-07-14b · hydras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden; background: #000;
      touch-action: none; -webkit-user-select: none; user-select: none;
    }
    #hydra-canvas {
      position: fixed; inset: 0;
      width: 100vw !important; width: 100dvw !important;
      height: 100vh !important; height: 100dvh !important;
      display: block; object-fit: cover; background: #000;
    }
  </style>
</head>
<body>
  <canvas id="hydra-canvas" aria-label="Hydra Coração"></canvas>
  <script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
  <script>
(function () {
  var canvas = document.getElementById('hydra-canvas');
  function size() {
    return {
      w: Math.max(1, Math.floor(window.innerWidth * (window.devicePixelRatio || 1))),
      h: Math.max(1, Math.floor(window.innerHeight * (window.devicePixelRatio || 1))),
      cssW: window.innerWidth,
      cssH: window.innerHeight
    };
  }
  var s = size();
  var hydra = new Hydra({
    canvas: canvas,
    detectAudio: false,
    makeGlobal: true,
    width: s.cssW,
    height: s.cssH
  });
  function onResize() {
    var n = size();
    if (typeof hydra.resize === 'function') hydra.resize(n.cssW, n.cssH);
    else if (typeof hydra.setResolution === 'function') hydra.setResolution(n.cssW, n.cssH);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 100); });

  // Exact patch — patches/2026-07-14b.js
  async function runPatch() {
    noise(5,0.02).thresh(0.5,0).color(1,0.1,0.1)
    .add( noise(5,0.022).thresh(0.5,0).color(1,0.1,0).rotate(-0.01,0.01) , 0.75)
    .add( noise(7,0.024).thresh(0.5,0).color(1,0,0) , 0.5)
    .modulate( noise (1,0.02) )
    
    .add( noise(15,0.10).thresh(0.7,0).color(1,0,0).rotate(0.01,0.012) , 0.5)
    .add( noise(25,0.09).thresh(0.8,0).scale(1,1,0.61).color(1,0.333,0) , 0.75)
    .add( noise(30,0.08).thresh(0.8,0).scale(1,1,0.61).color(1,0.333,0) , 0.75)
    
    .add( noise(10,0.08).thresh(0.7,0).scale(1,1,0.61).color(0,1,0) , 0.75)
    
    .add( noise(35,0.07).thresh(0.75,0).scale(1,1,0.61).color(1,0.333,0).rotate(0.01,0.008) , 0.75)
    
    .add( noise(2,0.01).thresh(0.8,0.5).scale(1,1,0.5).color(1,0.25,0) , 0.75)
    .diff( noise(0.5,0.011).thresh(0.8,0.5).scale(1,1,0.5).color(2,0,0) , 0.75)
    
    .mult( shape(4,0.8,0.2) )
    .contrast(10)
    .out()
  }
  runPatch().catch(function (e) { console.error(e); });
})();
  </script>
</body>
</html>
